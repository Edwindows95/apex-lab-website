<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Lab — Shader Cards Prototype</title>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "@paper-design/shaders-react": "https://esm.sh/@paper-design/shaders-react?external=react"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #FAF9F7;
      color: #1A1915;
      min-height: 100vh;
    }
    /* Apex Lab design tokens */
    :root {
      --bg: #FAF9F7;
      --surface-1: #FFFFFF;
      --surface-2: #F5F4F2;
      --surface-3: #ECEAE6;
      --text-primary: #1A1915;
      --text-secondary: #4A4640;
      --text-tertiary: #7A756C;
      --accent: #6B7D8A;
      --border-subtle: rgba(74,70,64,0.06);
      --border-default: rgba(74,70,64,0.12);
    }

    /* Page layout */
    .page { min-height: 100vh; padding: 80px 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(74,70,64,0.08);
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1.5px;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    .subtitle {
      font-size: 16px;
      color: var(--text-tertiary);
      max-width: 560px;
      line-height: 1.6;
      margin-bottom: 64px;
    }

    /* Cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    @media (max-width: 900px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .cards-grid { grid-template-columns: 1fr; } h1 { font-size: 32px; } }

    /* Individual shader card */
    .shader-card {
      position: relative;
      height: 340px;
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
    }
    .shader-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 14, 12, 0.72);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      flex-direction: column;
      padding: 32px;
      z-index: 10;
      backdrop-filter: blur(0px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .shader-card:hover .card-overlay {
      background: rgba(15, 14, 12, 0.62);
      border-color: rgba(255,255,255,0.22);
    }
    .card-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 20px;
      color: rgba(255,255,255,0.9);
    }
    .card-eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }
    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    .card-body {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,0.68);
      flex-grow: 1;
    }
    .card-link {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .shader-card:hover .card-link { color: rgba(255,255,255,0.85); }

    /* Variant row — shows the same with different overlays */
    .variants-heading {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 600;
      margin: 64px 0 8px;
      color: var(--text-primary);
    }
    .variants-sub {
      font-size: 14px;
      color: var(--text-tertiary);
      margin-bottom: 32px;
    }
    .variants-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    @media (max-width: 900px) { .variants-row { grid-template-columns: 1fr 1fr; } }

    /* Lighter overlay variant */
    .shader-card.light-overlay .card-overlay {
      background: rgba(250, 249, 247, 0.82);
      border-color: rgba(74,70,64,0.12);
    }
    .shader-card.light-overlay .card-icon { color: var(--text-primary); }
    .shader-card.light-overlay .card-eyebrow { color: var(--text-tertiary); }
    .shader-card.light-overlay .card-title { color: var(--text-primary); font-family: 'Space Grotesk', sans-serif; }
    .shader-card.light-overlay .card-body { color: var(--text-secondary); }
    .shader-card.light-overlay .card-link { color: var(--accent); }
    .shader-card.light-overlay:hover .card-overlay {
      background: rgba(250, 249, 247, 0.72);
      border-color: rgba(74,70,64,0.20);
    }

    /* No overlay — pure shader */
    .shader-card.no-overlay .card-overlay {
      background: transparent;
      border-color: rgba(255,255,255,0.10);
    }
    .shader-card.no-overlay:hover .card-overlay { background: rgba(0,0,0,0.08); }

    #root { display: contents; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text-tertiary);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Loading shaders…</div></div>

  <script type="text/babel" data-type="module">
    import React, { useState } from "react";
    import { createRoot } from "react-dom/client";
    import { Warp } from "@paper-design/shaders-react";

    // Apex Lab metric cards — adapted content
    const cards = [
      {
        eyebrow: "Recovery",
        title: "Body Battery",
        body: "Track your energy reserves throughout the day. See how work tasks drain or restore your physiological capacity.",
        icon: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        ),
        shader: {
          colors: ["hsl(160, 60%, 25%)", "hsl(140, 70%, 50%)", "hsl(170, 65%, 30%)", "hsl(130, 55%, 60%)"],
          proportion: 0.32, softness: 0.9, distortion: 0.14, swirl: 0.7, swirlIterations: 9,
          shape: "dots", shapeScale: 0.10, speed: 0.6,
        },
      },
      {
        eyebrow: "Stress",
        title: "Stress Index",
        body: "Understand your physiological stress responses in real time. Know which meetings and tasks cost you the most.",
        icon: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        ),
        shader: {
          colors: ["hsl(5, 75%, 28%)", "hsl(20, 90%, 55%)", "hsl(355, 70%, 40%)", "hsl(15, 80%, 65%)"],
          proportion: 0.38, softness: 1.1, distortion: 0.20, swirl: 0.85, swirlIterations: 12,
          shape: "checks", shapeScale: 0.09, speed: 0.7,
        },
      },
      {
        eyebrow: "Sleep",
        title: "Sleep Score",
        body: "Nightly sleep quality scored against your 30-day baseline. See how recovery patterns shift across the work week.",
        icon: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        ),
        shader: {
          colors: ["hsl(220, 75%, 28%)", "hsl(240, 80%, 60%)", "hsl(210, 70%, 35%)", "hsl(250, 65%, 70%)"],
          proportion: 0.36, softness: 0.85, distortion: 0.16, swirl: 0.65, swirlIterations: 10,
          shape: "dots", shapeScale: 0.12, speed: 0.5,
        },
      },
      {
        eyebrow: "Heart Rate",
        title: "Heart Rate",
        body: "Minute-by-minute heart rate mapped to your calendar. Spot the meetings that make your heart race.",
        icon: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 12h3l3-9 4 18 3-9h5"/>
          </svg>
        ),
        shader: {
          colors: ["hsl(195, 80%, 25%)", "hsl(175, 75%, 55%)", "hsl(185, 65%, 32%)", "hsl(200, 70%, 68%)"],
          proportion: 0.42, softness: 1.0, distortion: 0.18, swirl: 0.80, swirlIterations: 11,
          shape: "checks", shapeScale: 0.11, speed: 0.8,
        },
      },
      {
        eyebrow: "Autonomic",
        title: "HRV",
        body: "Heart Rate Variability reveals your autonomic nervous system state. Higher HRV = more adaptability and resilience.",
        icon: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        ),
        shader: {
          colors: ["hsl(270, 65%, 28%)", "hsl(290, 70%, 60%)", "hsl(260, 60%, 35%)", "hsl(280, 55%, 72%)"],
          proportion: 0.40, softness: 0.95, distortion: 0.17, swirl: 0.75, swirlIterations: 8,
          shape: "dots", shapeScale: 0.08, speed: 0.55,
        },
      },
      {
        eyebrow: "Calendar",
        title: "Work × Health",
        body: "Calendar events overlaid on physiological data. Understand your unique work-health fingerprint at a glance.",
        icon: (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        ),
        shader: {
          colors: ["hsl(35, 80%, 30%)", "hsl(45, 90%, 60%)", "hsl(40, 75%, 38%)", "hsl(50, 70%, 72%)"],
          proportion: 0.44, softness: 1.05, distortion: 0.21, swirl: 0.90, swirlIterations: 13,
          shape: "checks", shapeScale: 0.10, speed: 0.65,
        },
      },
    ];

    function ShaderCard({ card, variant = "dark" }) {
      return (
        <div className={`shader-card ${variant === "light" ? "light-overlay" : variant === "bare" ? "no-overlay" : ""}`}>
          <div className="shader-canvas">
            <Warp
              style={{ width: "100%", height: "100%" }}
              proportion={card.shader.proportion}
              softness={card.shader.softness}
              distortion={card.shader.distortion}
              swirl={card.shader.swirl}
              swirlIterations={card.shader.swirlIterations}
              shape={card.shader.shape}
              shapeScale={card.shader.shapeScale}
              scale={1}
              rotation={0}
              speed={card.shader.speed}
              colors={card.shader.colors}
            />
          </div>
          <div className="card-overlay">
            <div className="card-icon">{card.icon}</div>
            <div className="card-eyebrow">{card.eyebrow}</div>
            <div className="card-title">{card.title}</div>
            <div className="card-body">{card.body}</div>
            <div className="card-link">
              Explore
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [activeVariant, setActiveVariant] = useState("dark");

      return (
        <div className="page">
          <div className="container">
            <span className="section-label">Prototype — Shader Cards</span>
            <h1>Metrics that matter</h1>
            <p className="subtitle">
              WebGL shader backgrounds applied to Apex Lab metric cards. Three overlay styles below — dark, light, and bare.
            </p>

            {/* Variant toggle */}
            <div style={{ display: "flex", gap: "8px", marginBottom: "32px" }}>
              {["dark", "light", "bare"].map(v => (
                <button
                  key={v}
                  onClick={() => setActiveVariant(v)}
                  style={{
                    padding: "8px 20px",
                    borderRadius: "9999px",
                    border: "1.5px solid",
                    borderColor: activeVariant === v ? "var(--accent)" : "var(--border-default)",
                    background: activeVariant === v ? "var(--accent)" : "transparent",
                    color: activeVariant === v ? "#fff" : "var(--text-secondary)",
                    fontFamily: "Inter, sans-serif",
                    fontSize: "13px",
                    fontWeight: 600,
                    cursor: "pointer",
                    textTransform: "capitalize",
                  }}
                >
                  {v === "bare" ? "Bare shader" : `${v.charAt(0).toUpperCase() + v.slice(1)} overlay`}
                </button>
              ))}
            </div>

            {/* Cards grid */}
            <div className="cards-grid">
              {cards.map((card, i) => (
                <ShaderCard key={i} card={card} variant={activeVariant} />
              ))}
            </div>

            {/* Three variants side by side (first card only) */}
            <div className="variants-heading">All three styles — same card</div>
            <p className="variants-sub">Compare dark overlay vs light overlay vs bare shader</p>
            <div className="variants-row">
              {["dark", "light", "bare"].map(v => (
                <ShaderCard key={v} card={cards[1]} variant={v} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
